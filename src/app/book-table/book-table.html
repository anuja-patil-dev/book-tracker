<p>My reading list</p>
<form action="" class="p-4 border m-3">
    <div  class="gap-3 mb-3">
        <label for="title" class="">
         Book Title
        </label>
        
        <input type="text" [(ngModel)]="title" name="Title" id="title" placeholder="Book Title">
    </div>
    <div class="">
        <label for=""> Status</label>
        <div>
            <p for="reading" class="">Reading</p>
        <input type="radio" name="status" id="reading" [(ngModel)]="status" value="reading">
        </div>
        <br>
       <div>
         <label for="finished">Finished</label>
        <input type="radio" name="status" [(ngModel)]="status" value="finished" id="finished">
       </div>
    </div>
    @if(title === ''){
 <button (click)="addBook()" disabled>Add Book</button>
    }
    @else {
         <button (click)="addBook()">Add Book</button>
    }
   
   <p>{{message}}</p>
</form>

<table>
  <thead>
      <tr>
        <th>Sr No</th>
        <th>Title</th>
        <th>Status</th>
    </tr>
  </thead>
  <tbody>
    
        @for(value of allbooks;track value.id){
            <tr [ngClass]="value.status=='finished' ? 'bg-success' : 'bg-danger'">
                <td>{{value.id}}</td>
            <td>{{value.title}}</td>
            <td>{{value.status}}</td>
            </tr>
        }
        @empty {
            <p>No books yet</p>
        }
    
  </tbody>
</table>
